# tmux. Managed by chezmoi.
#
# Keymap layers on this machine: alt = AeroSpace (windows/workspaces),
# cmd = wezterm (tabs/panes), C-a = tmux, bare ctrl = shell.

# Prefix C-a instead of C-b. C-a is zsh beginning-of-line, so send-prefix keeps
# it reachable: press C-a twice to send a literal C-a to the shell.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# wezterm sets TERM=xterm-256color, whose terminfo has no RGB capability, so
# tmux would silently downgrade truecolor (visible in nvim's Catppuccin theme).
set -ga terminal-features "*:RGB"
